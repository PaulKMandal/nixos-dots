keys:
  # Replace this after creating /var/lib/sops-nix/age/keys.txt.
  # Get it with:
  #   sudo grep 'public key:' /var/lib/sops-nix/age/keys.txt
  - &nixos_laptop_age age1REPLACE_WITH_NIXOS_LAPTOP_AGE_PUBLIC_KEY

  # YubiKey-backed GPG key.
  - &yubikey_gpg 955986AF6BFBECAF1605620C2F0C8012A924FBAA

creation_rules:
  - path_regex: ^secrets/sops\.yaml$
    key_groups:
      - age:
          - *nixos_laptop_age
        pgp:
          - *yubikey_gpg
